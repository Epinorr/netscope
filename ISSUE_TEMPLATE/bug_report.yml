name: Bug report
description: Report a reproducible issue with NetScope
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please redact private details. Do not post public IPs, Wi-Fi passwords, tokens, or unredacted reports."
  - type: input
    id: version
    attributes:
      label: NetScope version
      placeholder: 1.2.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted output
    validations:
      required: true
